# The backend's tests on every push and pull request, and the service's image
# built. With Render's Auto-Deploy on "After CI Checks Pass", main deploys only
# once these pass, and a commit with no check is never deployed, so this runs
# on every commit: no path filter.
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

# It reads the code and needs nothing more. A pull request from a fork runs it
# with this token alone and no secrets, and nothing here needs one.
permissions:
  contents: read

jobs:
  test:
    # The two Pythons the repository runs on: 3.9, the dev Mac's .venv, which
    # `app/` stays compatible with; and 3.12, the service's image and Modal's
    # containers, with the Modal client, so the Modal app's shape is tested
    # too (`test_modal_app.py` skips without it).
    name: test (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.9"
            modal: ""
          - python: "3.12"
            modal: "-r pipeline/resolver/requirements.txt"
    # A Postgres for the SQL tests (`test_worker_pg.py`, `test_fold_pg.py`,
    # `tests/test_forget_built.py`). Each makes a scratch database with every
    # migration applied, and skips without one. Supabase runs 17.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      RESOLVER_TEST_DATABASE_URL: postgresql://postgres@localhost:5432/postgres
    steps:
      # Each action pinned to the commit its release names, so a moved tag
      # cannot change what runs here.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}

      - name: install the suite's packages
        run: python -m pip install -r requirements-dev.txt ${{ matrix.modal }}

      # The suite never reaches the network (CLAUDE.md); a test that needs a
      # tool this runner lacks (PyMOL, the Dart SDK) or stored tracks
      # (`pipeline/data/`) skips, and -rs says which.
      - name: pytest
        run: python -m pytest -q -rs

  image:
    # The service's image, built as Render builds it, so a broken Dockerfile
    # or requirements.txt fails here and not in a deploy. Nothing is pushed.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: docker build
        run: docker build --tag helix-peek-backend:ci .
